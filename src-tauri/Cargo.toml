[package]
name = "dotwallpaper"
version = "0.1.4"
description = "DotWallpaper 壁纸工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 必应壁纸：拉取每日列表 + 设为壁纸时下载原图
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# 缩略图生成（解码 jpg/png/bmp/webp，编码 webp/jpeg）
# 壁纸效果合成（模糊/裁剪/遮罩）直接使用 imageops::blur / resize / crop，无需额外 feature
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
tauri-plugin-autostart = "2"

# Windows Win32 API（设置桌面壁纸使用 SystemParametersInfoW）
# + Media Foundation（后端提取视频首帧生成缩略图）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

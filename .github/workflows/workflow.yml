name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 对应你本地的：cd ui && npm install
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      # 对应你本地最终执行 npm run tauri build
      # Tauri CLI 在根目录，所以必须安装根目录依赖
      - name: Install root dependencies
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DotWallpaper ${{ github.ref_name }}'

          # 发布说明。每次发版前把这三节按本次改动更新一遍，
          # 直接对应 `git log <上个 tag>..HEAD` 里的提交。
          # 写法要求：**给普通用户看的人话**，一条一句话，不写内部实现术语。
          # 当前内容对应 v0.1.7。
          releaseBody: |
            ### ✨ 新增
            - 动态壁纸没生效时会直接告诉你（面板红点 + 一行提示），不再是「提示成功、桌面却没变化」
            - 面板里可以一键诊断：桌面没画面时直接看原因，还能把结果复制/保存发给开发者

            ### 🐛 修复
            - 修复部分电脑上动态壁纸提示成功、桌面却没有任何画面
            - 修复设置失败时桌面上残留一块小图、鼠标还能点到
            - 修复设置失败后必须重启软件才能恢复
            - 修复关掉「显示桌面图标」后，右键桌面会弹出浏览器的视频菜单

            ### 🎨 优化
            - 画面异常时最多几秒自动恢复，不用重启软件

          releaseDraft: false
          prerelease: false

          # 你的 Tauri 项目在根目录，不是 ui
          projectPath: .
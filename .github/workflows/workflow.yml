name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 对应你本地的：cd ui && npm install
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      # 对应你本地最终执行 npm run tauri build
      # Tauri CLI 在根目录，所以必须安装根目录依赖
      - name: Install root dependencies
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DotWallpaper ${{ github.ref_name }}'

          # 发布说明。每次发版前把这三节按本次改动更新一遍，
          # 直接对应 `git log <上个 tag>..HEAD` 里的提交。
          releaseBody: |
            ### ✨ 新增
            - 动态壁纸支持 0.5× ~ 2× 六档播放速度
            - 新增循环模式：可切换「循环」/「单次」，单次播完停在末帧，省一半解码
            - 新增片段循环：只播指定的一段（如 12s ~ 30s），长视频可只取精彩部分
            - 智能暂停：全屏游戏、电池供电、锁屏时自动冻结画面，恢复后自动继续
            - 自动暂停记录：面板内可查看最近 20 次自动暂停的原因与时长
            - 删除壁纸改为移入回收站，误删可恢复

            ### 🐛 修复
            - 修复最小化后托盘唤不出
            - 修复软件多开情况
            - 修复 MSIX 打包找不到 winapp CLI
            - 修复播放参数设置后界面无反馈的问题

            ### 🎨 优化
            - 视频区块收拢为常驻三行，播放参数折叠进「播放设置」
            - 播放范围并入播放设置，与速度 / 循环 / 片段同级

          releaseDraft: false
          prerelease: false

          # 你的 Tauri 项目在根目录，不是 ui
          projectPath: .
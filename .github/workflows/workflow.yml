name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 对应你本地的：cd ui && npm install
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      # 对应你本地最终执行 npm run tauri build
      # Tauri CLI 在根目录，所以必须安装根目录依赖
      - name: Install root dependencies
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DotWallpaper ${{ github.ref_name }}'

          # 发布说明。每次发版前把这三节按本次改动更新一遍，
          # 直接对应 `git log <上个 tag>..HEAD` 里的提交。
          # 写法要求：**给普通用户看的人话**，一条一句话，不写内部实现术语。
          # 当前内容对应 v0.1.8（Pixabay + Wallhaven 两个在线图库）。
          releaseBody: |
            ### ✨ 新增
            - Pixabay 在线图库：按关键词搜索或分类浏览，热门 / 最新两种排序，滚到底自动加载下一页
            - Pixabay 也能搜视频：点一张直接在右侧预览，点「下载并设为动态壁纸」才真正下载
            - 视频清晰度可选 1080p 或 4K，素材没有 4K 时会自动降级并如实标出实际档位、时长与大小
            - Wallhaven 图库：不用注册、不用填 key，打开就能用；可按分类、分辨率、比例、颜色筛选
            - 壁纸来源可以自己增减：默认只留「本地 + 收藏」，用不到的收起来，也能拖动调整顺序

            ### 🐛 修复
            - 修复在线壁纸右键「跳转到当前文件目录」打开失败
            - 修复 Pixabay 搜不到结果时误提示「你的 key 只能拿 1280px」
            - 修复窗口缩到最小时左侧选项卡文字被挤成竖排
            - 修复在线图库连不上时只显示「没有结果」，看不出其实是网络问题

            ### 🎨 优化
            - 在线图库连不上时直接说明原因（连不上 / 超时分开提示），并给一个就地重试的按钮
            - 设置里可以填写 Pixabay API key 与视频清晰度，填错不用再改配置文件
            - 设置里可以为 Wallhaven 填写自己的加速地址，网络不畅时不用干等

          releaseDraft: false
          prerelease: false

          # 你的 Tauri 项目在根目录，不是 ui
          projectPath: .